; VARAL AUTOMATICO R5E - ESP32 WROOM-32 / 30 pinos
; A pasta data/ e gravada separadamente pelo comando Upload Filesystem Image.
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
